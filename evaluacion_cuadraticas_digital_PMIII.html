<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Evaluación Sumativa: Ecuaciones Cuadráticas y Parábolas | COBAO Plantel 21</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-option: #0f172a;
      --bg-option-hover: #1e1b4b;
      --bg-option-selected: #312e81;
      --border-subtle: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-indigo: #818cf8;
      --accent-btn: #4f46e5;
      --accent-btn-hover: #4338ca;
      --accent-emerald: #059669;
      --accent-emerald-hover: #047857;
      --accent-sky: #38bdf8;
      --accent-amber: #fbbf24;
      --accent-purple: #c084fc;
      --correct-bg: #064e3b;
      --correct-text: #6ee7b7;
      --wrong-bg: #7f1d1d;
      --wrong-text: #fca5a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      line-height: 1.45;
    }

    header {
      background-color: var(--bg-card);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-title {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: 700;
      color: var(--accent-indigo);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat-badge {
      background-color: var(--bg-main);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      border: 1px solid var(--border-subtle);
    }

    .stat-counter {
      color: var(--accent-sky);
    }

    .stat-score {
      color: var(--accent-amber);
    }

    .sound-toggle {
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 1020px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .category-badge {
      align-self: flex-start;
      background-color: #1e1b4b;
      color: var(--accent-purple);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 6px;
      letter-spacing: 0.4px;
      border: 1px solid #3730a3;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: start;
    }

    .content-grid.has-graph {
      grid-template-columns: 1.25fr 0.95fr;
    }

    @media (max-width: 820px) {
      .content-grid.has-graph {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--bg-card);
      border-radius: 12px;
      padding: 18px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .prompt-text {
      font-size: clamp(1rem, 2.3vw, 1.15rem);
      font-weight: 600;
      color: var(--text-primary);
      white-space: pre-line;
      margin-bottom: 16px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background-color: var(--bg-option);
      color: var(--text-secondary);
      border: 2px solid var(--border-subtle);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: clamp(0.9rem, 2.1vw, 1rem);
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: all 0.15s ease;
      word-break: break-word;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--bg-option-hover);
      border-color: var(--accent-indigo);
    }

    .option-btn.selected:not(:disabled) {
      background-color: var(--bg-option-selected);
      border-color: var(--accent-indigo);
      color: #ffffff;
    }

    .option-btn.correct {
      background-color: var(--correct-bg) !important;
      border-color: #10b981 !important;
      color: var(--correct-text) !important;
    }

    .option-btn.wrong {
      background-color: var(--wrong-bg) !important;
      border-color: #ef4444 !important;
      color: var(--wrong-text) !important;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-letter {
      font-weight: 700;
      color: var(--accent-sky);
      min-width: 24px;
    }

    .option-btn.correct .option-letter {
      color: var(--correct-text);
    }

    .option-btn.wrong .option-letter {
      color: var(--wrong-text);
    }

    .graph-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .canvas-wrapper {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1 / 0.92;
      position: relative;
    }

    canvas#parabolaCanvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 8px;
      background-color: var(--bg-main);
      border: 1px solid #475569;
    }

    .feedback-box {
      display: none;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      white-space: pre-line;
      border: 1px solid transparent;
    }

    .feedback-box.visible {
      display: block;
    }

    .feedback-box.success {
      background-color: rgba(6, 78, 59, 0.45);
      border-color: #10b981;
      color: #34d399;
    }

    .feedback-box.error {
      background-color: rgba(127, 29, 29, 0.45);
      border-color: #ef4444;
      color: #f87171;
    }

    .feedback-box.warning {
      background-color: rgba(120, 53, 15, 0.5);
      border-color: #f59e0b;
      color: #fbbf24;
    }

    footer {
      background-color: var(--bg-card);
      border-top: 1px solid var(--border-subtle);
      padding: 12px 16px;
      position: sticky;
      bottom: 0;
      z-index: 20;
    }

    .footer-inner {
      max-width: 1020px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .action-btn {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 0.98rem;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      transition: background-color 0.15s ease, opacity 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-verify {
      background-color: var(--accent-btn);
    }

    .btn-verify:hover:not(:disabled) {
      background-color: var(--accent-btn-hover);
    }

    .btn-next {
      background-color: var(--accent-emerald);
    }

    .btn-next:hover:not(:disabled) {
      background-color: var(--accent-emerald-hover);
    }

    .action-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    @media (max-width: 520px) {
      .footer-inner {
        flex-direction: column;
      }
      .action-btn {
        width: 100%;
      }
    }

    .report-title {
      font-size: clamp(1.15rem, 3vw, 1.45rem);
      font-weight: 800;
      color: var(--accent-indigo);
      text-align: center;
      margin-bottom: 16px;
    }

    .report-rows {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .report-row {
      background-color: var(--bg-main);
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .report-cat {
      font-weight: 700;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .report-val {
      font-family: 'Consolas', monospace;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .divider {
      height: 1px;
      background-color: #475569;
      margin: 18px 0;
    }

    .total-score-text {
      text-align: center;
      font-size: clamp(1.1rem, 2.8vw, 1.35rem);
      font-weight: 800;
      color: var(--accent-sky);
      margin-bottom: 10px;
    }

    .status-text {
      text-align: center;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .restart-wrap {
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <span>📐</span>
      <span>Evaluación Final: Ecuaciones Cuadráticas | COBAO Plantel 21</span>
    </div>
    <div class="stats-bar">
      <div id="lblCounter" class="stat-badge stat-counter">Pregunta: 1 / 15</div>
      <div id="lblScore" class="stat-badge stat-score">Aciertos: 0 | Racha: 0 🔥</div>
      <button id="btnSound" class="sound-toggle" title="Activar o silenciar sonido">🔊</button>
    </div>
  </header>

  <main id="mainContainer"></main>

  <footer id="footerBar">
    <div class="footer-inner">
      <button id="btnVerify" class="action-btn btn-verify">✔ Verificar Respuesta</button>
      <button id="btnNext" class="action-btn btn-next" disabled>Siguiente Pregunta ➔</button>
    </div>
  </footer>

  <script>
    let soundEnabled = true;
    let audioCtx = null;

    function playTone(freq, durationMs, delayMs = 0) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;

        const startTime = audioCtx.currentTime + delayMs / 1000;
        const endTime = startTime + durationMs / 1000;

        gain.gain.setValueAtTime(0.15, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, endTime);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(endTime);
      } catch (e) {}
    }

    function playSound(eventType) {
      if (!soundEnabled) return;
      if (eventType === 'correct') {
        playTone(523, 90, 0);
        playTone(659, 90, 95);
        playTone(784, 140, 190);
      } else if (eventType === 'streak') {
        playTone(523, 80, 0);
        playTone(659, 80, 85);
        playTone(784, 80, 170);
        playTone(1046, 220, 255);
      } else if (eventType === 'wrong') {
        playTone(220, 200, 0);
      } else if (eventType === 'finish') {
        const seq = [
          [523, 100], [659, 100], [784, 100],
          [1046, 250], [784, 100], [1046, 350]
        ];
        let offset = 0;
        for (const [f, d] of seq) {
          playTone(f, d, offset);
          offset += d + 15;
        }
      }
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function randChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function sample(arr, k) {
      return shuffle(arr).slice(0, k);
    }

    function range(start, end) {
      const res = [];
      for (let i = start; i < end; i++) res.push(i);
      return res;
    }

    class QuestionGenerator {
      static fmtCoef(val, variable = "", first = false) {
        if (val === 0) return "";
        let sign = "";
        if (!first) {
          sign = val > 0 ? " + " : " - ";
        } else if (val < 0) {
          sign = "-";
        }
        const absV = Math.abs(val);
        const numStr = (absV === 1 && variable !== "") ? "" : String(absV);
        return `${sign}${numStr}${variable}`;
      }

      static buildEqStr(a, b, c) {
        const parts = [];
        if (a !== 0) parts.push(this.fmtCoef(a, "x²", true));
        if (b !== 0) parts.push(this.fmtCoef(b, "x", parts.length === 0));
        if (c !== 0) parts.push(this.fmtCoef(c, "", parts.length === 0));
        return parts.join("") + " = 0";
      }

      static generateAllQuestions() {
        const questions = [];

        let eq1, reason1;
        if (randChoice([true, false])) {
          const m = randInt(2, 9);
          const n = randInt(-12, 12);
          eq1 = `${m}x ${n >= 0 ? '+ ' + n : '- ' + Math.abs(n)} = 0`;
          reason1 = "El exponente máximo de la variable x es 1 (es una ecuación lineal).";
        } else {
          const d = randInt(2, 4);
          const a = randInt(1, 5);
          eq1 = `${d}x³ + ${a}x² - 4 = 0`;
          reason1 = "El grado máximo de la ecuación es 3 (cúbica), por lo que no es cuadrática.";
        }

        const optsB1 = shuffle([
          "No es una ecuación cuadrática",
          `Sí es cuadrática: a = 1, b = ${randInt(2, 6)}, c = -4`,
          `Sí es cuadrática: a = 0, b = ${randInt(2, 5)}, c = ${randInt(1, 7)}`,
          `Sí es cuadrática: a = ${randInt(2, 4)}, b = -1, c = 0`
        ]);

        questions.push({
          category: "1. Identificación y Coeficientes",
          prompt: `Analiza la siguiente expresión algebraica:\n\n${eq1}\n\n¿Es una ecuación cuadrática y cuáles son sus coeficientes?`,
          options: optsB1,
          correctIdx: optsB1.indexOf("No es una ecuación cuadrática"),
          feedback: `Correcto: ${reason1} En una ecuación cuadrática ax² + bx + c = 0 siempre debe cumplirse que a ≠ 0 y el mayor exponente sea 2.`,
          graph: null
        });

        for (let idx = 0; idx < 2; idx++) {
          const a = randChoice([-4, -3, -2, -1, 2, 3, 4, 5]);
          let b = idx === 0 ? randInt(-8, 8) : 0;
          if (idx === 0 && b === 0) {
            b = randChoice([-6, -3, 3, 6]);
          }
          let c = randInt(-10, 10);
          if (b === 0 && c === 0) {
            c = randChoice([-9, -4, 4, 9]);
          }

          const eq = this.buildEqStr(a, b, c);
          const correctOpt = `Sí es cuadrática: a = ${a}, b = ${b}, c = ${c}`;
          const distractors = [
            `Sí es cuadrática: a = ${a}, b = ${c}, c = ${b}`,
            `Sí es cuadrática: a = ${Math.abs(a)}, b = ${b !== 0 ? -b : 1}, c = ${c}`,
            "No es una ecuación cuadrática (le falta un término)"
          ];
          const opts = shuffle([correctOpt, ...distractors]);

          questions.push({
            category: "1. Identificación y Coeficientes",
            prompt: `Determina si la ecuación es cuadrática e identifica los valores de a, b y c:\n\n${eq}`,
            options: opts,
            correctIdx: opts.indexOf(correctOpt),
            feedback: `Al comparar ${eq} con la forma general ax² + bx + c = 0, identificamos: a = ${a} (término cuadrático), b = ${b} (término lineal) y c = ${c} (término independiente).`,
            graph: null
          });
        }

        const discTypes = shuffle(["positive", "zero", "negative"]);
        for (const dtype of discTypes) {
          let a, b, c;
          if (dtype === "positive") {
            const [x1, x2] = sample(range(-5, 6), 2);
            a = randChoice([1, 2]);
            b = -a * (x1 + x2);
            c = a * x1 * x2;
          } else if (dtype === "zero") {
            const r = randChoice([-4, -3, -2, -1, 1, 2, 3, 4]);
            a = 1;
            b = -2 * r;
            c = r * r;
          } else {
            a = randChoice([1, 2]);
            b = randChoice([-3, -2, 2, 3]);
            c = randInt(4, 8);
          }

          const delta = b * b - 4 * a * c;
          const eq = this.buildEqStr(a, b, c);
          let nature;
          if (delta > 0) nature = "2 raíces reales distintas";
          else if (delta === 0) nature = "1 raíz real doble (única)";
          else nature = "No tiene raíces reales (complejas)";

          const correctOpt = `Δ = ${delta} → ${nature}`;
          const distractors = [
            `Δ = ${delta + randChoice([4, 6, 8])} → 2 raíces reales distintas`,
            `Δ = ${delta !== 0 ? -delta : 4} → ${delta >= 0 ? 'No tiene raíces reales' : '2 raíces reales distintas'}`,
            `Δ = ${b * b + 4 * a * c} → 1 raíz real doble`
          ];

          let opts = Array.from(new Set([correctOpt, ...distractors]));
          while (opts.length < 4) {
            opts.push(`Δ = ${delta - randInt(2, 9)} → No tiene raíces reales`);
            opts = Array.from(new Set(opts));
          }
          opts = shuffle(opts.slice(0, 4));

          const compStr = delta > 0 ? "> 0" : (delta === 0 ? "= 0" : "< 0");
          questions.push({
            category: "2. Cálculo del Discriminante",
            prompt: `Calcula el discriminante (Δ = b² - 4ac) y determina la naturaleza de las raíces de:\n\n${eq}`,
            options: opts,
            correctIdx: opts.indexOf(correctOpt),
            feedback: `Sustituyendo a=${a}, b=${b}, c=${c}: Δ = (${b})² - 4(${a})(${c}) = ${b * b} - (${4 * a * c}) = ${delta}. Como Δ ${compStr}, ${nature.toLowerCase()}.`,
            graph: null
          });
        }

        const usedH = [];
        for (let i = 0; i < 3; i++) {
          const allH = [-4, -3, -2, -1, 1, 2, 3, 4];
          const candidatesH = allH.filter(v => !usedH.includes(v));
          const hVertex = randChoice(candidatesH.length ? candidatesH : allH);
          usedH.push(hVertex);

          const b = -2 * hVertex;
          const rOffset = randChoice([1, 2, 3]);
          const kVertex = -(rOffset * rOffset);
          const c = hVertex * hVertex + kVertex;
          const x1 = hVertex - rOffset;
          const x2 = hVertex + rOffset;

          const eq = this.buildEqStr(1, b, c);
          const halfBSq = Math.pow(Math.trunc(b / 2), 2);

          const correctOpt = `Vértice V(${hVertex}, ${kVertex}) | Raíces: x₁ = ${x1}, x₂ = ${x2}`;
          const distractors = [
            `Vértice V(${-hVertex}, ${kVertex}) | Raíces: x₁ = ${-x2}, x₂ = ${-x1}`,
            `Vértice V(${hVertex}, ${-kVertex}) | Raíces: x₁ = ${x1}, x₂ = ${x2}`,
            `Vértice V(${Math.trunc(b / 2)}, ${halfBSq}) | Raíces: x₁ = ${x1 - 1}, x₂ = ${x2 + 1}`
          ];
          const opts = shuffle([correctOpt, ...distractors]);

          const hSign = hVertex > 0 ? `- ${hVertex}` : `+ ${Math.abs(hVertex)}`;
          questions.push({
            category: "3. Completar el Cuadrado y Vértice",
            prompt: `Completa el trinomio cuadrado perfecto para la ecuación:\n\n${eq}\n\nDetermina las coordenadas del vértice V(h, k) y sus raíces:`,
            options: opts,
            correctIdx: opts.indexOf(correctOpt),
            feedback:
              `1) Aislando c: x² ${b > 0 ? '+ ' + b : '- ' + Math.abs(b)}x = ${-c}.\n` +
              `2) Sumando (b/2)² = (${Math.trunc(b / 2)})² = ${halfBSq} en ambos lados: (x ${hSign})² = ${rOffset * rOffset}.\n` +
              `3) Forma estándar: y = (x ${hSign})² - ${Math.abs(kVertex)} → Vértice V(${hVertex}, ${kVertex}).\n` +
              `4) Despejando x ${hSign} = ±${rOffset} → x₁ = ${x1}, x₂ = ${x2}.`,
            graph: null
          });
        }

        for (let i = 0; i < 3; i++) {
          const [x1, x2] = sample(range(-5, 6), 2).sort((m, n) => m - n);
          const a = randChoice([1, 2, 3]);
          const b = -a * (x1 + x2);
          const c = a * x1 * x2;
          const delta = b * b - 4 * a * c;
          const eq = this.buildEqStr(a, b, c);

          const correctOpt = `x₁ = ${x1}  y  x₂ = ${x2}`;
          const distractors = [
            `x₁ = ${-x2}  y  x₂ = ${-x1}`,
            `x₁ = ${x1 * a}  y  x₂ = ${x2 * a}`,
            `x₁ = ${x1 + 1}  y  x₂ = ${x2 - 1}`
          ];

          let opts = Array.from(new Set([correctOpt, ...distractors]));
          while (opts.length < 4) {
            opts.push(`x₁ = ${x1 - 2}  y  x₂ = ${x2 + 2}`);
            opts = Array.from(new Set(opts));
          }
          opts = shuffle(opts.slice(0, 4));

          const sqrtDelta = Math.round(Math.sqrt(delta));
          questions.push({
            category: "4. Fórmula General (Bhaskara)",
            prompt: `Aplica la fórmula general x = [-b ± √(b² - 4ac)] / (2a) para hallar las raíces de:\n\n${eq}`,
            options: opts,
            correctIdx: opts.indexOf(correctOpt),
            feedback:
              `Con a=${a}, b=${b}, c=${c}: Δ = ${delta} (√Δ = ${sqrtDelta}).\n` +
              `x = [${-b} ± ${sqrtDelta}] / ${2 * a} → x₁ = ${x1} y x₂ = ${x2}.`,
            graph: null
          });
        }

        for (let i = 0; i < 3; i++) {
          const a = randChoice([-1, 1]);
          const x1 = randChoice([-4, -3, -2, -1, 0, 1]);
          const dist = randChoice([2, 4]);
          const x2 = x1 + dist;
          const hV = Math.trunc((x1 + x2) / 2);
          const b = -a * (x1 + x2);
          const c = a * x1 * x2;
          const kV = a * (hV * hV) + b * hV + c;

          const correctOpt = `Raíces: (${x1}, 0) y (${x2}, 0) | Vértice: (${hV}, ${kV})`;
          const distractors = [
            `Raíces: (0, ${x1}) y (0, ${x2}) | Vértice: (${kV}, ${hV})`,
            `Raíces: (${-x2}, 0) y (${-x1}, 0) | Vértice: (${-hV}, ${kV})`,
            `Raíces: (${x1}, 0) y (${x2}, 0) | Vértice: (0, ${c})`
          ];
          const opts = shuffle([correctOpt, ...distractors]);

          questions.push({
            category: "5. Análisis Gráfico (Raíces y Vértice)",
            prompt: "Observa atentamente la parábola graficada en el plano cartesiano.\n¿Cuáles son las coordenadas de sus raíces (cortes con el eje X) y de su vértice?",
            options: opts,
            correctIdx: opts.indexOf(correctOpt),
            feedback:
              `En la gráfica, la curva cruza el eje horizontal X (donde y=0) en (${x1}, 0) y (${x2}, 0). ` +
              `El punto ${a > 0 ? 'mínimo' : 'máximo'} de simetría (vértice) se ubica en V(${hV}, ${kV}), y corta al eje Y en (0, ${c}).`,
            graph: { a, b, c, x1, x2, h: hV, k: kV }
          });
        }

        return questions;
      }
    }

    function drawParabolaCanvas(canvas, graphData) {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const width = rect.width || 360;
      const height = rect.height || 330;

      canvas.width = width * dpr;
      canvas.height = height * dpr;

      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      const pad = 28;
      const plotW = width - pad * 2;
      const plotH = height - pad * 2;

      const xMin = -6, xMax = 6;
      const yMin = -8, yMax = 8;

      const toPxX = (x) => pad + ((x - xMin) / (xMax - xMin)) * plotW;
      const toPxY = (y) => pad + ((yMax - y) / (yMax - yMin)) * plotH;

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 0.8;
      ctx.setLineDash([4, 4]);

      for (let x = xMin; x <= xMax; x++) {
        const px = toPxX(x);
        ctx.beginPath();
        ctx.moveTo(px, pad);
        ctx.lineTo(px, height - pad);
        ctx.stroke();
      }
      for (let y = yMin; y <= yMax; y += 2) {
        const py = toPxY(y);
        ctx.beginPath();
        ctx.moveTo(pad, py);
        ctx.lineTo(width - pad, py);
        ctx.stroke();
      }
      ctx.restore();

      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1.5;

      const yZero = toPxY(0);
      ctx.beginPath();
      ctx.moveTo(pad, yZero);
      ctx.lineTo(width - pad, yZero);
      ctx.stroke();

      const xZero = toPxX(0);
      ctx.beginPath();
      ctx.moveTo(xZero, pad);
      ctx.lineTo(xZero, height - pad);
      ctx.stroke();

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '10px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      for (let x = xMin; x <= xMax; x++) {
        if (x === 0) continue;
        ctx.fillText(String(x), toPxX(x), height - pad + 6);
      }

      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      for (let y = yMin; y <= yMax; y += 2) {
        if (y === 0) continue;
        ctx.fillText(String(y), pad - 6, toPxY(y));
      }

      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 1;
      ctx.strokeRect(pad, pad, plotW, plotH);

      ctx.save();
      ctx.beginPath();
      ctx.rect(pad, pad, plotW, plotH);
      ctx.clip();

      const { a, b, c, x1, x2, h, k } = graphData;
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      const steps = 240;
      for (let i = 0; i <= steps; i++) {
        const x = xMin + (i / steps) * (xMax - xMin);
        const y = a * x * x + b * x + c;
        const px = toPxX(x);
        const py = toPxY(y);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();

      const drawPoint = (x, y, color) => {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(toPxX(x), toPxY(y), 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      };

      drawPoint(x1, 0, '#f59e0b');
      drawPoint(x2, 0, '#f59e0b');
      drawPoint(h, k, '#f43f5e');

      ctx.restore();
    }

    class QuadraticEvaluationWebApp {
      constructor() {
        this.mainContainer = document.getElementById('mainContainer');
        this.footerBar = document.getElementById('footerBar');
        this.lblCounter = document.getElementById('lblCounter');
        this.lblScore = document.getElementById('lblScore');
        this.btnVerify = document.getElementById('btnVerify');
        this.btnNext = document.getElementById('btnNext');
        this.btnSound = document.getElementById('btnSound');

        this.btnVerify.addEventListener('click', () => this.verifyAnswer());
        this.btnNext.addEventListener('click', () => this.nextQuestion());
        this.btnSound.addEventListener('click', () => {
          soundEnabled = !soundEnabled;
          this.btnSound.textContent = soundEnabled ? '🔊' : '🔇';
        });

        window.addEventListener('resize', () => {
          const q = this.questions?.[this.currentIdx];
          const canvas = document.getElementById('parabolaCanvas');
          if (q && q.graph && canvas) {
            drawParabolaCanvas(canvas, q.graph);
          }
        });

        this.startNewSession();
      }

      startNewSession() {
        this.questions = QuestionGenerator.generateAllQuestions();
        this.totalQ = this.questions.length;
        this.currentIdx = 0;
        this.score = 0;
        this.streak = 0;
        this.selectedChoice = null;
        this.answeredCurrent = false;

        this.categoryStats = {};
        for (const q of this.questions) {
          if (!this.categoryStats[q.category]) {
            this.categoryStats[q.category] = { correct: 0, total: 0 };
          }
          this.categoryStats[q.category].total += 1;
        }

        this.lblScore.textContent = "Aciertos: 0 | Racha: 0 🔥";
        this.footerBar.style.display = "block";
        this.loadQuestion();
      }

      loadQuestion() {
        const q = this.questions[this.currentIdx];
        this.answeredCurrent = false;
        this.selectedChoice = null;

        this.lblCounter.textContent = `Pregunta: ${this.currentIdx + 1} / ${this.totalQ}`;
        this.btnVerify.disabled = false;
        this.btnNext.disabled = true;
        this.btnNext.textContent =
          this.currentIdx === this.totalQ - 1 ? "Ver Resultados Finales 🏆" : "Siguiente Pregunta ➔";

        const hasGraph = q.graph !== null;
        this.mainContainer.innerHTML = `
          <div class="category-badge">BLOQUE: ${q.category.toUpperCase()}</div>
          <div class="content-grid ${hasGraph ? 'has-graph' : ''}">
            <div class="card">
              <div class="prompt-text">${this.escapeHtml(q.prompt)}</div>
              <div class="options-list" id="optionsList"></div>
            </div>
            ${hasGraph ? `
              <div class="card graph-card">
                <div class="canvas-wrapper">
                  <canvas id="parabolaCanvas"></canvas>
                </div>
              </div>
            ` : ''}
          </div>
          <div id="feedbackBox" class="feedback-box"></div>
        `;

        const optionsList = document.getElementById('optionsList');
        q.options.forEach((optText, i) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'option-btn';
          btn.innerHTML = `
            <span class="option-letter">${String.fromCharCode(65 + i)})</span>
            <span>${this.escapeHtml(optText)}</span>
          `;
          btn.addEventListener('click', () => this.selectOption(i));
          optionsList.appendChild(btn);
        });

        if (hasGraph) {
          const canvas = document.getElementById('parabolaCanvas');
          requestAnimationFrame(() => drawParabolaCanvas(canvas, q.graph));
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      selectOption(index) {
        if (this.answeredCurrent) return;
        this.selectedChoice = index;
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
          btn.classList.toggle('selected', idx === index);
        });

        const fb = document.getElementById('feedbackBox');
        if (fb.classList.contains('warning')) {
          fb.className = 'feedback-box';
          fb.textContent = '';
        }
      }

      verifyAnswer() {
        if (this.answeredCurrent) return;

        const fb = document.getElementById('feedbackBox');
        if (this.selectedChoice === null) {
          fb.className = 'feedback-box visible warning';
          fb.textContent = '⚠️ Por favor selecciona una opción (A, B, C o D) antes de verificar.';
          return;
        }

        this.answeredCurrent = true;
        const q = this.questions[this.currentIdx];
        const correctIdx = q.correctIdx;
        const cat = q.category;

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, i) => {
          btn.disabled = true;
          btn.classList.remove('selected');
          if (i === correctIdx) {
            btn.classList.add('correct');
          } else if (i === this.selectedChoice && this.selectedChoice !== correctIdx) {
            btn.classList.add('wrong');
          }
        });

        if (this.selectedChoice === correctIdx) {
          this.score += 1;
          this.streak += 1;
          this.categoryStats[cat].correct += 1;

          let motiv;
          if (this.streak >= 3) {
            playSound('streak');
            motiv = `🔥 ¡RACHA DE ${this.streak} ACIERTOS! ¡Excelente dominio!`;
          } else {
            playSound('correct');
            motiv = '✅ ¡RESPUESTA CORRECTA! ¡Muy bien hecho!';
          }

          fb.className = 'feedback-box visible success';
          fb.textContent = `${motiv}\n${q.feedback}`;
        } else {
          this.streak = 0;
          playSound('wrong');
          const correctLetter = String.fromCharCode(65 + correctIdx);
          fb.className = 'feedback-box visible error';
          fb.textContent = `❌ RESPUESTA INCORRECTA (La opción correcta era ${correctLetter}).\n${q.feedback}`;
        }

        this.lblScore.textContent = `Aciertos: ${this.score} | Racha: ${this.streak} 🔥`;
        this.btnVerify.disabled = true;
        this.btnNext.disabled = false;
      }

      nextQuestion() {
        if (this.currentIdx < this.totalQ - 1) {
          this.currentIdx += 1;
          this.loadQuestion();
        } else {
          this.showFinalReport();
        }
      }

      showFinalReport() {
        playSound('finish');
        this.footerBar.style.display = 'none';

        const individualPercentages = [];
        let rowsHtml = '';

        for (const [cat, data] of Object.entries(this.categoryStats)) {
          const pct = (data.correct / data.total) * 100;
          individualPercentages.push(pct);
          const colorPct = pct >= 80 ? '#34d399' : (pct >= 60 ? '#fbbf24' : '#f87171');

          rowsHtml += `
            <div class="report-row">
              <span class="report-cat">${this.escapeHtml(cat)}</span>
              <span class="report-val" style="color: ${colorPct};">
                ${data.correct}/${data.total} aciertos → ${pct.toFixed(1)}%
              </span>
            </div>
          `;
        }

        const totalPct = individualPercentages.reduce((acc, v) => acc + v, 0) / individualPercentages.length;
        let statusMsg, statusColor;
        if (totalPct >= 85) {
          statusMsg = "🏆 NIVEL AVANZADO: Dominas plenamente las ecuaciones cuadráticas y su representación gráfica.";
          statusColor = "#34d399";
        } else if (totalPct >= 65) {
          statusMsg = "👍 NIVEL SATISFACTORIO: Buen manejo del tema. Refuerza los bloques con menor porcentaje.";
          statusColor = "#fbbf24";
        } else {
          statusMsg = "📚 EN DESARROLLO: Se recomienda volver a practicar en el Laboratorio Interactivo antes de reintentar.";
          statusColor = "#f87171";
        }

        this.mainContainer.innerHTML = `
          <div class="card">
            <h2 class="report-title">📊 REPORTE DE DESEMPEÑO Y DOMINIO DEL TEMA</h2>
            <div class="report-rows">${rowsHtml}</div>
            <div class="divider"></div>
            <div class="total-score-text">
              PORCENTAJE TOTAL (Promedio de Competencias): ${totalPct.toFixed(1)}%
            </div>
            <div class="status-text" style="color: ${statusColor};">
              ${statusMsg}
            </div>
            <div class="restart-wrap">
              <button id="btnRestart" class="action-btn btn-verify">
                🔄 Generar Nueva Evaluación Aleatoria
              </button>
            </div>
          </div>
        `;

        document.getElementById('btnRestart').addEventListener('click', () => this.startNewSession());
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      new QuadraticEvaluationWebApp();
    });
  </script>
